# v* etiketi itildiğinde: test et, GitHub Release aç.
#   npm version 1.2.1 && git push --follow-tags
# Yayın = etiket: jsDelivr dosyaları doğrudan etiketten sunar
#   https://cdn.jsdelivr.net/gh/StreamEmber/overlay-core-web@<sürüm>/src/index.js  (npm yok)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Etiket ile package.json sürümü aynı mı?
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "::error::Etiket v$TAG ama package.json $PKG"; exit 1; }
      - run: npm test
      - name: CDN'i ısıt
        run: curl -fsS -o /dev/null "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@${GITHUB_REF_NAME#v}/src/index.js"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
